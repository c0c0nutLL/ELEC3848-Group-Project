<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Unlock</title>
  <style>
    :root {
      --bg: #efe8dc;
      --panel: rgba(255, 252, 246, 0.94);
      --line: #cfc4b3;
      --text: #201d18;
      --muted: #6e665b;
      --accent: #166a62;
      --danger: #b54c2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 240, 187, 0.7) 0, transparent 26%),
        radial-gradient(circle at bottom right, rgba(182, 223, 212, 0.7) 0, transparent 28%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .panel {
      width: min(460px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(32, 29, 24, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .meta {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .meta strong {
      color: var(--text);
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 18px;
      background: #fffefa;
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .result {
      margin-top: 16px;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      background: #fffaf1;
      min-height: 56px;
      line-height: 1.5;
    }

    .result.ok {
      border-color: rgba(22, 106, 98, 0.35);
      color: var(--accent);
    }

    .result.error {
      border-color: rgba(181, 76, 46, 0.35);
      color: var(--danger);
    }

    .footer {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Open Cargo Door</h1>
    <p class="sub">Scan the QR code on the AMR, enter the password, then Jetson Nano will verify it and send an unlock command to Arduino.</p>

    <div class="meta">
      <div>Robot ID: <strong id="robot-id">--</strong></div>
      <div>Unlock Mode: <strong id="unlock-mode">--</strong></div>
      <div>Current State: <strong id="robot-state">--</strong></div>
    </div>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter fixed password" autocomplete="current-password">
    <button id="submit-btn" type="button">Unlock</button>

    <div id="result" class="result">Waiting for password input.</div>

    <div class="footer">
      Home: <a href="/">Open control home</a><br>
      Dashboard: <a href="/dashboard">Open live status page</a>
    </div>
  </div>

  <script>
    const robotIdNode = document.getElementById("robot-id");
    const unlockModeNode = document.getElementById("unlock-mode");
    const robotStateNode = document.getElementById("robot-state");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submit-btn");
    const resultNode = document.getElementById("result");

    function setResult(message, ok) {
      resultNode.textContent = message;
      resultNode.classList.remove("ok", "error");
      if (ok === true) {
        resultNode.classList.add("ok");
      } else if (ok === false) {
        resultNode.classList.add("error");
      }
    }

    async function refreshInfo() {
      try {
        const [configRes, stateRes] = await Promise.all([
          fetch("/api/config"),
          fetch("/api/state"),
        ]);

        const config = await configRes.json();
        const state = await stateRes.json();

        robotIdNode.textContent = config.robot_id || "--";
        unlockModeNode.textContent = config.unlock_mode || "--";
        robotStateNode.textContent = state.state || "--";
      } catch (error) {
        setResult(`Failed to load status: ${error}`, false);
      }
    }

    async function submitUnlock() {
      const password = passwordInput.value;
      if (!password) {
        setResult("Password cannot be empty.", false);
        return;
      }

      submitBtn.disabled = true;
      setResult("Sending unlock request...", null);

      try {
        const response = await fetch("/api/unlock", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ password }),
        });

        const payload = await response.json();
        setResult(payload.message || "Unknown response", response.ok);

        if (response.ok) {
          passwordInput.value = "";
        }

        await refreshInfo();
      } catch (error) {
        setResult(`Unlock request failed: ${error}`, false);
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener("click", submitUnlock);
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        submitUnlock();
      }
    });

    refreshInfo();
  </script>
</body>
</html>
